name: agent-service tests

on:
  push:
    paths:
      - "agent-service/**"
      - ".github/workflows/agent-service-tests.yml"
  pull_request:
    paths:
      - "agent-service/**"
      - ".github/workflows/agent-service-tests.yml"

defaults:
  run:
    working-directory: agent-service

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline test suite
        env:
          AGENT_SECRET: ${{ secrets.AGENT_SECRET || 'ci-placeholder-secret-0123456789abcdef0123' }}
        run: python -m pytest tests -q
