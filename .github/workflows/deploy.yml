name: Deploy to Aeroplane

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aeroplane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore env files for the deploy script
        shell: bash
        run: |
          if [ -n "$BACKEND_ENV_B64" ]; then
            echo "$BACKEND_ENV_B64" | base64 --decode > backend/.env
          fi
          if [ -n "$FRONTEND_ENV_B64" ]; then
            echo "$FRONTEND_ENV_B64" | base64 --decode > frontend/.env
          fi
        env:
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
          FRONTEND_ENV_B64: ${{ secrets.FRONTEND_ENV_B64 }}

      - name: Deploy api, web, worker to Aeroplane
        run: node .github/deploy-aeroplane.mjs --force
        env:
          AEROPLANE_URL: ${{ secrets.AEROPLANE_URL }}
          AEROPLANE_API_KEY: ${{ secrets.AEROPLANE_API_KEY }}
          AEROPLANE_PROJECT_ID: ${{ secrets.AEROPLANE_PROJECT_ID }}
          AEROPLANE_PROJECT_SLUG: ${{ secrets.AEROPLANE_PROJECT_SLUG }}